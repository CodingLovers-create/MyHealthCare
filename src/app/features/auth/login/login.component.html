<div class="relative min-h-screen w-full flex flex-col justify-between overflow-hidden bg-cover bg-center bg-no-repeat select-none"
     style="background-image: url('assets/images/mountain-bg.jpg'); font-family: 'Inter', 'Roboto', -apple-system, sans-serif;">
  
  <!-- Subtle gradient background overlay for ideal text contrast -->
  <div class="absolute inset-0 bg-gradient-to-b from-white/30 via-transparent to-white/50 pointer-events-none"></div>

  <!-- TOP HEADER BAR -->
  <header class="relative z-10 w-full px-8 py-6 flex items-center justify-between">
    
    <!-- Logo Left -->
    <div class="flex items-center">
      <div class="relative flex items-center">
        <svg class="w-20 h-16 text-[#d93848]" viewBox="0 0 120 90" fill="none">
          <path d="M60 82C60 82 12 55 12 30C12 16.5 23.5 8 36.5 8C44.5 8 54 12.5 60 21C66 12.5 75.5 8 83.5 8C96.5 8 108 16.5 108 30C108 55 60 82 60 82Z" 
                stroke="#d93848" stroke-width="4.5" stroke-linecap="round" fill="none"/>
          <text x="60" y="44" font-size="10.5" font-weight="600" fill="#d93848" text-anchor="middle" font-family="'Inter', sans-serif">MyHealthcare</text>
        </svg>
      </div>
    </div>

    <!-- Live Clock & Date Right -->
    <div class="text-right text-[#4a4a4a] tracking-tight">
      <div class="text-3xl md:text-4xl font-extralight text-[#333333] leading-none tracking-normal font-sans">{{ currentTime }}</div>
      <div class="text-xs text-[#666666] font-light mt-1">{{ currentDate }}</div>
    </div>
  </header>

  <!-- MAIN CENTER LOGIN SECTION -->
  <main class="relative z-10 flex-1 flex items-center justify-center px-4 py-6">
    <div class="w-full max-w-3xl text-center">
      
      <!-- Heading -->
      <h1 class="text-2xl md:text-3xl font-light text-[#4a4a4a] mb-8 tracking-normal">
        Please Enter the Credentials to Login
      </h1>


      <!-- Template-Driven Form Box with #loginForm="ngForm" -->
      <form #loginForm="ngForm" (ngSubmit)="onLogin(loginForm)" class="space-y-4">
        
        <!-- Side-by-side Inputs Row -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-3 max-w-xl mx-auto">
          
          <!-- Username / Phone / Email Input -->
          <div class="w-full sm:w-1/2">
            <input type="text" 
                   [(ngModel)]="credentials.identifier" 
                   name="identifier"
                   #identifierCtrl="ngModel"
                   placeholder="Enter Username or Email"
                   class="w-full px-3.5 py-2 bg-white/95 border border-slate-300 rounded text-slate-800 text-xs placeholder:text-slate-400 focus:outline-none focus:border-[#d93848] transition-colors shadow-xs" />
          </div>

          <!-- Password Input -->
          <div class="w-full sm:w-1/2">
            <input type="password" 
                   [(ngModel)]="credentials.password" 
                   name="password"
                   #passwordCtrl="ngModel"
                   placeholder="Enter Password"
                   class="w-full px-3.5 py-2 bg-white/95 border border-slate-300 rounded text-slate-800 text-xs placeholder:text-slate-400 focus:outline-none focus:border-[#d93848] transition-colors shadow-xs" />
          </div>

        </div>

        <!-- LOGIN BUTTON -->
        <div class="pt-2">
          <button type="submit" 
                  [disabled]="isLoading"
                  class="inline-flex items-center justify-center space-x-2 px-12 py-2.5 bg-[#d93848] hover:bg-[#c02a3a] active:scale-[0.98] disabled:opacity-60 text-white font-bold text-xs tracking-wider uppercase rounded shadow-md transition-all duration-150 cursor-pointer">
            @if (isLoading) {
              <i class="fa-solid fa-spinner fa-spin text-xs"></i>
              <span>LOGGING IN...</span>
            } @else {
              <i class="fa-solid fa-right-to-bracket text-xs mr-1"></i>
              <span>LOGIN</span>
            }
          </button>
        </div>

      </form>

      <!-- Terms & Privacy Policy text -->
      <p class="text-[11px] text-[#555555] mt-5 font-normal">
        By signing in, you agree to our 
        <a href="https://www.myhealthcare.life/terms-of-service/" target="_blank" class="text-[#d93848] hover:underline">Terms of Service</a> 
        and 
        <a href="https://www.myhealthcare.life/privacy-policy/" target="_blank" class="text-[#d93848] hover:underline">Privacy Policy</a>
      </p>

    </div>
  </main>

  <!-- BOTTOM CERTIFICATION BADGES FOOTER with @for loop -->
  <footer class="relative z-10 w-full py-5 px-4">
    <div class="max-w-4xl mx-auto flex flex-wrap items-center justify-center gap-2 sm:gap-3">
      
      @for (badge of badges; track badge.id) {
        <div [class]="'flex items-center space-x-1 px-2.5 py-0.5 bg-white/90 border rounded-md shadow-2xs ' + badge.borderColor">
          @if (badge.isTextBadge) {
            <div [class]="'w-5 h-5 rounded flex items-center justify-center text-white text-[8px] font-bold ' + badge.iconBg">
              {{ badge.textBadge }}
            </div>
          } @else {
            <div [class]="'w-5 h-5 rounded-full flex items-center justify-center text-white text-[9px] ' + badge.iconBg">
              <i [class]="badge.icon"></i>
            </div>
          }
          <div class="text-[9px] text-slate-700 leading-tight">
            <span [class]="'font-bold block ' + badge.titleColor">{{ badge.title }}</span>
            <span class="text-[7px] text-slate-500">{{ badge.subText }}</span>
          </div>
        </div>
      }

    </div>
  </footer>

</div>
